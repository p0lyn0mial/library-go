apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: {{ .Namespace }}
data:
  vault.hcl: |
    listener "tcp" {
      tls_disable = 1
      address     = "[::]:8200"
    }

    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-node-1"
    }

    disable_mlock = true
